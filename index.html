<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bass Online</title>
<style>
  :root {
    --bg: #f3f3f2;
    --card: #ffffff;
    --ink: #111111;
    --ink-2: #3a3a3a;
    --mute: #8c8c8c;
    --line: #e2e2e0;
    --soft: #ededeb;
    --neck: #161616;
    --fret: #5a5a5a;
    --string: #d6d6d6;
    --dot: #2c2c2c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: var(--mute); font-weight: 400; }
  .hint { color: var(--mute); font-size: 13px; }

  @media (max-width: 560px) { .hint { display: none; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; margin-bottom: 12px; }
  .group { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
  .group button, .chip, .btn {
    font: inherit; font-size: 14px; color: var(--ink-2);
    border: 0; background: transparent; cursor: pointer;
    height: 34px; min-width: 38px; padding: 0 10px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, color .12s;
  }
  .group button:hover, .chip:hover, .btn:hover { background: #e2e2df; }
  .group button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .group button svg { display: block; }
  .chip { background: var(--soft); }
  .chip.on { background: var(--ink); color: #fff; }
    .spacer { flex: 1; }
  .tempo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tempo b { min-width: 28px; display: inline-block; }
  input[type=range] { width: 110px; accent-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; padding: 0 16px; font-weight: 600; }
  .btn.primary:hover { background: #333; }

  /* Score */
  .score { padding: 8px 4px 4px; position: relative; }
  #score { display: block; width: 100%; cursor: crosshair; user-select: none; }
  .empty {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    color: var(--mute); font-size: 13px; pointer-events: none;
  }
  .status {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums;
  }

  /* Fretboard */
  .bass { margin-top: 16px; padding: 18px 16px 14px; }
  .bass-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .bass-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .bass-head span { font-size: 12px; color: var(--mute); }
  .neck-scroll { overflow-x: auto; }
  #fret { display: block; width: 100%; min-width: 720px; }
  #fret .cell { fill: transparent; cursor: pointer; }
  #fret .cell:hover { fill: rgba(255,255,255,.07); }

  .keys { margin-top: 14px; font-size: 12px; color: var(--mute); line-height: 1.8; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">bass<span>.online</span></div>
    <div class="hint">타브 악보에 적으면 베이스가 연주합니다</div>
  </header>

  <div class="card toolbar">
    <div class="group" id="durs" aria-label="음표 길이"></div>
    <button class="chip" id="restBtn" title="쉼표 입력 (S)">쉼표</button>
    <div class="spacer"></div>
    <label class="tempo">♩ = <b id="bpmVal">100</b><input type="range" id="bpm" min="40" max="200" value="100"></label>
    <button class="btn" id="delBtn" title="선택하거나 마지막 음 지우기 (Backspace)">지우기</button>
    <button class="btn" id="clearBtn">전체 삭제</button>
    <button class="btn primary" id="playBtn" title="재생 / 정지 (Space)">▶ 재생</button>
  </div>

  <div class="card">
    <div class="score">
      <svg id="score" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="empty" id="empty">타브의 줄을 클릭한 뒤 숫자로 프렛을 입력하거나, 아래 지판을 눌러 입력하세요</div>
    </div>
    <div class="status">
      <span id="stat">마디 0 · 음표 0</span>
      <span id="info"></span>
    </div>
  </div>

  <div class="card bass">
    <div class="bass-head">
      <h2>4현 베이스</h2>
      <span>E · A · D · G 표준 튜닝</span>
    </div>
    <div class="neck-scroll"><svg id="fret" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="keys">
      <kbd>Q</kbd> 온음표 <kbd>W</kbd> 2분 <kbd>E</kbd> 4분 <kbd>R</kbd> 8분 · <kbd>S</kbd> 쉼표 ·
      <kbd>0</kbd>–<kbd>9</kbd> 프렛 (<kbd>1</kbd><kbd>0</kbd>~<kbd>1</kbd><kbd>2</kbd>는 이어서) ·
      <kbd>↑</kbd><kbd>↓</kbd> 프렛 ± · <kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd> 줄 이동 ·
      <kbd>←</kbd><kbd>→</kbd> 음표 이동 · <kbd>Backspace</kbd> 지우기 · <kbd>Space</kbd> 재생/정지 · <kbd>Esc</kbd> 선택 해제
    </div>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const DURS = [4, 2, 1, 0.5];
  const DUR_NAME = { 4: '온음표', 2: '2분음표', 1: '4분음표', 0.5: '8분음표' };
  const DUR_KEY = { q: 4, w: 2, e: 1, r: 0.5 };

  // 4현 베이스 개방현 MIDI: E1 A1 D2 G2 (s: 0=E … 3=G)
  const OPEN = [28, 33, 38, 43];
  const STR_NAME = ['E', 'A', 'D', 'G'];
  const FRETS = 12;

  // 타브 배치 상수: 줄 간격 16, 위에서부터 G D A E
  const SYS_H = 130, TOP = 28, GAP = 16, BOT = TOP + GAP * 3;
  const LEFT = 14, CLEF_W = 34, TS_W = 26, PAD_R = 14;
  const WIDTH = { 4: 80, 2: 58, 1: 42, 0.5: 34 };

  const state = {
    notes: [],          // {s, f, beats, rest}
    dur: 1, rest: false, tempo: 100,
    selected: -1, editing: -1, playhead: -1,
    lastFret: 0,
    hover: null,        // {s}
  };

  const svg = document.getElementById('score');
  const fret = document.getElementById('fret');

  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------- 음높이 ----------
  const midiOf = n => OPEN[n.s] + n.f;
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);
  const pitchName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  const letter = m => NAMES[m % 12];
  const describe = n => `${STR_NAME[n.s]}현 ${n.f}프렛 (${pitchName(midiOf(n))})`;

  // ---------- 소리 ----------
  let ctx = null, master = null;
  const audio = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  function pluck(midi, t, len, dest) {
    const f = freq(midi);
    const saw = ctx.createOscillator(); saw.type = 'sawtooth'; saw.frequency.value = f;
    const sine = ctx.createOscillator(); sine.type = 'sine'; sine.frequency.value = f;
    const oct = ctx.createOscillator(); oct.type = 'triangle'; oct.frequency.value = f * 2;
    const gSaw = ctx.createGain(); gSaw.gain.value = 0.32;
    const gSine = ctx.createGain(); gSine.gain.value = 0.75;
    const gOct = ctx.createGain(); gOct.gain.value = 0.12;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(Math.min(f * 14 + 500, 6000), t);
    lp.frequency.exponentialRampToValueAtTime(f * 2.5 + 140, t + 0.28);

    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.9, t + 0.006);
    env.gain.setTargetAtTime(0.38, t + 0.006, 0.22);
    const end = t + Math.max(len, 0.08);
    env.gain.setTargetAtTime(0, end, 0.035);

    saw.connect(gSaw).connect(lp);
    sine.connect(gSine).connect(lp);
    oct.connect(gOct).connect(lp);
    lp.connect(env).connect(dest);
    [saw, sine, oct].forEach(o => { o.start(t); o.stop(end + 0.3); });
  }

  function preview(n) {
    if (!n || n.rest) return;
    audio();
    pluck(midiOf(n), ctx.currentTime + 0.01, 0.5, master);
  }

  // ---------- 재생 ----------
  let playback = null, raf = 0;
  const playBtn = document.getElementById('playBtn');

  function play() {
    if (!state.notes.length) return;
    audio();
    state.editing = -1;
    const out = ctx.createGain(); out.connect(master);
    const spb = 60 / state.tempo;
    let t = ctx.currentTime + 0.08;
    const start = state.selected >= 0 ? state.selected : 0;
    const events = [];
    for (let i = start; i < state.notes.length; i++) {
      const n = state.notes[i];
      const len = n.beats * spb;
      if (!n.rest) pluck(midiOf(n), t, len * 0.92, out);
      events.push({ i, t });
      t += len;
    }
    playback = { out, events, end: t };
    playBtn.textContent = '■ 정지';
    tick();
  }

  function stop() {
    if (!playback) return;
    const out = playback.out;
    out.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
    setTimeout(() => out.disconnect(), 300);
    playback = null;
    cancelAnimationFrame(raf);
    state.playhead = -1;
    playBtn.textContent = '▶ 재생';
    render();
  }

  function tick() {
    if (!playback) return;
    const now = ctx.currentTime;
    if (now >= playback.end) { stop(); return; }
    let cur = -1;
    for (const ev of playback.events) if (now >= ev.t) cur = ev.i;
    if (cur !== state.playhead) { state.playhead = cur; render(); }
    raf = requestAnimationFrame(tick);
  }

  // ---------- 배치 ----------
  function layout(width) {
    const items = [], bars = [];
    let sys = 0, cursor = LEFT + CLEF_W + TS_W, beats = 0;
    const limit = width - PAD_R;
    state.notes.forEach((n, i) => {
      const w = WIDTH[n.beats];
      if (cursor + w > limit) { sys++; cursor = LEFT + CLEF_W; }
      items.push({ i, x: cursor + 18, sys });
      cursor += w;
      beats += n.beats;
      if (beats >= 4 - 1e-9) { bars.push({ x: cursor, sys }); cursor += 6; beats = 0; }
    });
    let gSys = sys, gCursor = cursor;
    if (gCursor + WIDTH[state.dur] > limit) { gSys++; gCursor = LEFT + CLEF_W; }
    return { items, bars, systems: gSys + 1, ghost: { x: gCursor + 18, sys: gSys } };
  }

  const yOfStr = (s, sys) => sys * SYS_H + TOP + (3 - s) * GAP;
  const strFromY = (y, sys) => {
    const s = 3 - Math.round((y - sys * SYS_H - TOP) / GAP);
    return Math.max(0, Math.min(3, s));
  };

  // ---------- 타브 그리기 ----------
  function drawClef(g, x, sys) {
    const top = sys * SYS_H + TOP;
    ['T', 'A', 'B'].forEach((ch, k) => {
      const t = el('text', {
        x, y: top + 8 + k * 16, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 15, 'font-weight': 800, fill: 'var(--ink)',
      }, g);
      t.textContent = ch;
    });
  }

  function drawTime(g, x, sys) {
    const top = sys * SYS_H + TOP;
    for (const dy of [12, 36]) {
      const t = el('text', {
        x, y: top + dy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 22, 'font-weight': 800, 'font-family': 'Georgia, "Times New Roman", serif', fill: 'var(--ink)',
      }, g);
      t.textContent = '4';
    }
  }

  // 리듬 기둥: 타브 아래 (온음표 없음, 2분 짧게, 4분 길게, 8분 깃발)
  function drawRhythm(g, beats, x, sys, color) {
    if (beats >= 4) return;
    const y0 = sys * SYS_H + BOT + 10;
    const y1 = y0 + (beats === 2 ? 12 : 24);
    el('line', { x1: x, x2: x, y1: y0, y2: y1, stroke: color, 'stroke-width': 1.4 }, g);
    if (beats === 0.5) {
      el('path', { d: `M${x} ${y1} C${x + 1} ${y1 - 6} ${x + 9} ${y1 - 7} ${x + 8} ${y1 - 16} C${x + 7} ${y1 - 11} ${x + 4} ${y1 - 9} ${x} ${y1 - 9} Z`, fill: color }, g);
    }
  }

  function drawNote(g, n, x, sys, color, label) {
    if (n.rest) return drawRest(g, n.beats, x, sys, color);
    const y = yOfStr(n.s, sys);
    const text = label ?? String(n.f);
    const w = text.length > 1 ? 18 : 11;
    el('rect', { x: x - w / 2, y: y - 7, width: w, height: 14, fill: 'var(--card)' }, g);
    if (n.beats >= 2) el('circle', { cx: x, cy: y, r: 9, fill: 'none', stroke: color, 'stroke-width': 1 }, g);
    const t = el('text', {
      x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
      'font-size': 13, 'font-weight': 700, fill: color, 'font-variant-numeric': 'tabular-nums',
    }, g);
    t.textContent = text;
    drawRhythm(g, n.beats, x, sys, color);
  }

  function drawRest(g, beats, x, sys, color) {
    const mid = sys * SYS_H + TOP + 24;
    if (beats === 4) el('rect', { x: x - 6, y: mid - 8, width: 12, height: 5, fill: color }, g);
    else if (beats === 2) el('rect', { x: x - 6, y: mid - 3, width: 12, height: 5, fill: color }, g);
    else if (beats === 1) {
      el('path', {
        d: `M${x - 3} ${mid - 15} L${x + 4} ${mid - 7} L${x - 2} ${mid - 1} L${x + 4} ${mid + 6} C${x - 3} ${mid + 3} ${x - 4} ${mid + 10} ${x + 1} ${mid + 14}`,
        fill: 'none', stroke: color, 'stroke-width': 2.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }, g);
    } else {
      el('circle', { cx: x - 3, cy: mid - 5, r: 2.6, fill: color }, g);
      el('path', { d: `M${x - 4} ${mid - 3} Q${x} ${mid - 1} ${x + 4} ${mid - 7} L${x - 1} ${mid + 9}`, fill: 'none', stroke: color, 'stroke-width': 1.5 }, g);
    }
  }

  let lastLayout = null;

  function renderScore() {
    const width = svg.clientWidth || 800;
    const L = layout(width);
    lastLayout = L;
    const h = L.systems * SYS_H + 6;
    svg.setAttribute('viewBox', `0 0 ${width} ${h}`);
    svg.setAttribute('height', h);
    svg.textContent = '';

    const bg = el('g', {}, svg);
    const mark = (idx, fill, stroke) => {
      const it = L.items[idx]; if (!it) return;
      el('rect', { x: it.x - 15, y: it.sys * SYS_H + TOP - 18, width: 30, height: 104, rx: 7, fill, stroke: stroke || 'none' }, bg);
    };
    if (state.playhead >= 0) mark(state.playhead, '#e6e6e4');
    const focus = state.editing >= 0 ? state.editing : state.selected;
    if (focus >= 0 && focus !== state.playhead) mark(focus, 'none', '#b5b5b2');

    for (let s = 0; s < L.systems; s++) {
      const g = el('g', {}, svg);
      for (let k = 0; k < 4; k++) {
        const y = s * SYS_H + TOP + k * GAP;
        el('line', { x1: LEFT, x2: width - PAD_R, y1: y, y2: y, stroke: '#9a9a98', 'stroke-width': 1 }, g);
      }
      el('line', { x1: LEFT, x2: LEFT, y1: s * SYS_H + TOP, y2: s * SYS_H + BOT, stroke: 'var(--ink)', 'stroke-width': 1.2 }, g);
      drawClef(g, LEFT + 16, s);
      if (s === 0) drawTime(g, LEFT + CLEF_W + 8, s);
    }

    for (const b of L.bars) {
      el('line', { x1: b.x, x2: b.x, y1: b.sys * SYS_H + TOP, y2: b.sys * SYS_H + BOT, stroke: 'var(--ink)', 'stroke-width': 1.2 }, svg);
    }

    const ng = el('g', {}, svg);
    for (const it of L.items) drawNote(ng, state.notes[it.i], it.x, it.sys, 'var(--ink)');

    if (state.hover && !playback) {
      const gh = L.ghost;
      const n = state.rest ? { rest: true, beats: state.dur } : { s: state.hover.s, f: state.lastFret, beats: state.dur };
      drawNote(el('g', { opacity: 0.32 }, svg), n, gh.x, gh.sys, 'var(--ink)');
    }

    document.getElementById('empty').style.display = state.notes.length ? 'none' : '';
  }

  // ---------- 지판 ----------
  const NUT = 64, NECK_END = 985;
  const fretX = n => NUT + ((1 - Math.pow(2, -n / 12)) / 0.5) * (NECK_END - NUT);
  const strY = s => 150 - s * 36; // E 아래, G 위 (타브와 같은 순서)
  const cellX = f => (f === 0 ? NUT / 2 + 4 : (fretX(f - 1) + fretX(f)) / 2);
  let fretLayer;

  function buildFret() {
    el('rect', { x: NUT, y: 18, width: NECK_END - NUT, height: 150, rx: 4, fill: 'var(--neck)' }, fret);
    [3, 5, 7, 9].forEach(f => el('circle', { cx: cellX(f), cy: 96, r: 6, fill: 'var(--dot)' }, fret));
    el('circle', { cx: cellX(12), cy: 60, r: 6, fill: 'var(--dot)' }, fret);
    el('circle', { cx: cellX(12), cy: 132, r: 6, fill: 'var(--dot)' }, fret);
    for (let f = 1; f <= FRETS; f++) {
      el('line', { x1: fretX(f), x2: fretX(f), y1: 18, y2: 168, stroke: 'var(--fret)', 'stroke-width': 2 }, fret);
      const t = el('text', { x: cellX(f), y: 184, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mute)' }, fret);
      t.textContent = f;
    }
    el('rect', { x: NUT - 5, y: 16, width: 6, height: 154, rx: 1.5, fill: '#e8e8e6' }, fret);
    OPEN.forEach((_, s) => {
      const y = strY(s);
      el('line', { x1: 34, x2: NECK_END, y1: y, y2: y, stroke: 'var(--string)', 'stroke-width': 3.4 - s * 0.6 }, fret);
      const t = el('text', { x: 14, y, 'dominant-baseline': 'central', 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: 'var(--ink-2)' }, fret);
      t.textContent = STR_NAME[s];
    });
    fretLayer = el('g', { 'pointer-events': 'none' }, fret);
    const hit = el('g', {}, fret);
    OPEN.forEach((_, s) => {
      for (let f = 0; f <= FRETS; f++) {
        const x0 = f === 0 ? 26 : fretX(f - 1), x1 = f === 0 ? NUT - 5 : fretX(f);
        const c = el('rect', { class: 'cell', x: x0, y: strY(s) - 18, width: x1 - x0, height: 36 }, hit);
        c.addEventListener('pointerdown', e => { e.preventDefault(); onFret(s, f); });
      }
    });
  }

  let flash = null, flashTimer = 0;

  function renderFret() {
    fretLayer.textContent = '';
    const marks = [];
    const idx = state.playhead >= 0 ? state.playhead : state.editing >= 0 ? state.editing : state.selected;
    const n = state.notes[idx];
    if (n && !n.rest) marks.push({ s: n.s, f: n.f });
    if (flash && !marks.some(m => m.s === flash.s && m.f === flash.f)) marks.push(flash);
    for (const m of marks) {
      const x = cellX(m.f), y = strY(m.s);
      el('circle', { cx: x, cy: y, r: 12, fill: '#fafafa', stroke: '#000', 'stroke-width': 1.5 }, fretLayer);
      const t = el('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 10.5, 'font-weight': 700, fill: '#111' }, fretLayer);
      t.textContent = letter(OPEN[m.s] + m.f);
    }
  }

  // ---------- 상태 표시 ----------
  function renderStatus() {
    const total = state.notes.reduce((a, n) => a + n.beats, 0);
    const measures = Math.ceil(total / 4 - 1e-9);
    document.getElementById('stat').textContent = `마디 ${measures} · 음표 ${state.notes.length}`;
    let info;
    const focus = state.notes[state.editing >= 0 ? state.editing : state.selected];
    if (focus) info = `${state.editing >= 0 ? '입력 중 · 숫자로 프렛' : '선택'}: ${focus.rest ? '쉼표' : describe(focus)} · ${DUR_NAME[focus.beats]}`;
    else if (state.hover && !state.rest) info = `입력: ${describe({ s: state.hover.s, f: state.lastFret })} · ${DUR_NAME[state.dur]}`;
    else info = `입력: ${state.rest ? '쉼표' : '음표'} · ${DUR_NAME[state.dur]}`;
    document.getElementById('info').textContent = info;

    document.querySelectorAll('#durs button').forEach(b => b.classList.toggle('on', +b.dataset.b === state.dur));
    document.getElementById('restBtn').classList.toggle('on', state.rest);
  }

  function render() { renderScore(); renderFret(); renderStatus(); }

  // ---------- 입력 ----------
  function append(n, editing = false) {
    state.notes.push(n);
    state.selected = -1;
    state.editing = editing ? state.notes.length - 1 : -1;
    preview(n);
    render();
  }

  function onFret(s, f) {
    if (playback) stop();
    state.lastFret = f;
    const sel = state.notes[state.selected];
    if (sel && !sel.rest) {
      sel.s = s; sel.f = f;
      preview(sel);
      render();
    } else {
      append({ s, f, beats: state.dur, rest: false });
    }
    clearTimeout(flashTimer);
    flash = { s, f };
    renderFret();
    flashTimer = setTimeout(() => { flash = null; renderFret(); }, 450);
  }

  function pointerInfo(e) {
    const r = svg.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const sys = Math.max(0, Math.min((lastLayout?.systems ?? 1) - 1, Math.floor(y / SYS_H)));
    return { x, y, sys };
  }

  svg.addEventListener('pointermove', e => {
    const { y, sys } = pointerInfo(e);
    const s = strFromY(y, sys);
    if (!state.hover || state.hover.s !== s) { state.hover = { s }; renderScore(); renderStatus(); }
  });
  svg.addEventListener('pointerleave', () => { state.hover = null; renderScore(); renderStatus(); });

  svg.addEventListener('pointerdown', e => {
    if (playback) stop();
    const { x, y, sys } = pointerInfo(e);
    const hit = lastLayout.items.find(it => {
      if (it.sys !== sys || Math.abs(it.x - x) > 12) return false;
      const n = state.notes[it.i];
      return n.rest || Math.abs(yOfStr(n.s, sys) - y) < 9;
    });
    if (hit) {
      state.editing = -1;
      state.selected = state.selected === hit.i ? -1 : hit.i;
      if (state.selected >= 0) preview(state.notes[hit.i]);
      render();
      return;
    }
    if (state.selected >= 0) { state.selected = -1; render(); return; }
    if (state.rest) append({ rest: true, beats: state.dur, s: 0, f: 0 });
    else append({ s: strFromY(y, sys), f: state.lastFret, beats: state.dur, rest: false }, true);
  });

  function del() {
    if (playback) stop();
    const idx = state.editing >= 0 ? state.editing : state.selected;
    state.editing = -1;
    if (idx >= 0) {
      state.notes.splice(idx, 1);
      state.selected = state.selected >= 0 ? Math.min(idx, state.notes.length - 1) : -1;
    } else state.notes.pop();
    render();
  }

  function setDur(b) {
    state.dur = b;
    const n = state.notes[state.editing >= 0 ? state.editing : state.selected];
    if (n) n.beats = b;
    render();
  }

  // 숫자 키로 프렛 입력 (1 다음 0~2 를 빨리 누르면 10~12)
  let digitBuf = '', digitTime = 0;
  function typeFret(dg) {
    const n = state.notes[state.editing >= 0 ? state.editing : state.selected];
    if (!n || n.rest) return;
    const now = performance.now();
    let v = +dg;
    if (digitBuf === '1' && now - digitTime < 800 && v <= 2) { v = 10 + v; digitBuf = ''; }
    else digitBuf = dg;
    digitTime = now;
    n.f = Math.min(FRETS, v);
    state.lastFret = n.f;
    preview(n); render();
  }

  // 툴바
  const durWrap = document.getElementById('durs');
  const keyOf = { 4: 'Q', 2: 'W', 1: 'E', 0.5: 'R' };
  DURS.forEach(b => {
    const btn = document.createElement('button');
    btn.dataset.b = b;
    btn.title = `${DUR_NAME[b]} (${keyOf[b]})`;
    const s = el('svg', { width: 18, height: 24, viewBox: '0 0 18 24' }, btn);
    const filled = b <= 1;
    el('ellipse', { cx: 7, cy: 18.5, rx: 4.8, ry: 3.4, transform: 'rotate(-20 7 18.5)', fill: filled ? 'currentColor' : 'none', stroke: 'currentColor', 'stroke-width': filled ? 1 : 1.6 }, s);
    if (b < 4) el('line', { x1: 11.3, x2: 11.3, y1: 18, y2: 2, stroke: 'currentColor', 'stroke-width': 1.4 }, s);
    if (b === 0.5) el('path', { d: 'M11.3 2 C12 6 17 7 16 13 C15 9 13 8 11.3 8 Z', fill: 'currentColor' }, s);
    btn.addEventListener('click', () => setDur(b));
    durWrap.appendChild(btn);
  });
  document.getElementById('restBtn').addEventListener('click', () => { state.rest = !state.rest; render(); });
  document.getElementById('delBtn').addEventListener('click', del);
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!state.notes.length || !confirm('악보를 모두 지울까요?')) return;
    if (playback) stop();
    state.notes = []; state.selected = state.editing = -1; render();
  });
  playBtn.addEventListener('click', () => (playback ? stop() : play()));
  const bpm = document.getElementById('bpm');
  bpm.addEventListener('input', () => { state.tempo = +bpm.value; document.getElementById('bpmVal').textContent = bpm.value; });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); playback ? stop() : play(); return; }
    if (e.target === bpm) return;
    const lk = k.toLowerCase();
    const focusIdx = state.editing >= 0 ? state.editing : state.selected;
    const focus = state.notes[focusIdx];
    if (/^[0-9]$/.test(k)) typeFret(k);
    else if (DUR_KEY[lk]) setDur(DUR_KEY[lk]);
    else if (lk === 's') { state.rest = !state.rest; render(); }
    else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); del(); }
    else if (k === 'Escape' || k === 'Enter') { state.selected = state.editing = -1; render(); }
    else if ((k === 'ArrowUp' || k === 'ArrowDown') && focus && !focus.rest) {
      e.preventDefault();
      if (e.shiftKey) focus.s = Math.max(0, Math.min(3, focus.s + (k === 'ArrowUp' ? 1 : -1)));
      else focus.f = Math.max(0, Math.min(FRETS, focus.f + (k === 'ArrowUp' ? 1 : -1)));
      state.lastFret = focus.f;
      preview(focus); render();
    } else if ((k === 'ArrowLeft' || k === 'ArrowRight') && state.notes.length) {
      e.preventDefault();
      const max = state.notes.length - 1;
      const cur = focusIdx < 0 ? (k === 'ArrowLeft' ? max + 1 : -1) : focusIdx;
      state.editing = -1;
      state.selected = Math.max(0, Math.min(max, cur + (k === 'ArrowLeft' ? -1 : 1)));
      preview(state.notes[state.selected]); render();
    }
  });

  window.addEventListener('resize', renderScore);
  buildFret();
  render();
})();
</script>
</body>
</html>
