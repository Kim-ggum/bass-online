<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bass Online</title>
<style>
  :root {
    --bg: #f3f3f2;
    --card: #ffffff;
    --ink: #111111;
    --ink-2: #3a3a3a;
    --mute: #8c8c8c;
    --line: #e2e2e0;
    --soft: #ededeb;
    --neck: #161616;
    --fret: #5a5a5a;
    --string: #d6d6d6;
    --dot: #2c2c2c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 16px 48px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .brand span { color: var(--mute); font-weight: 400; }
  .hint { color: var(--mute); font-size: 13px; }

  @media (max-width: 560px) { .hint { display: none; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

  /* Toolbar */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; margin-bottom: 12px; }
  .group { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 2px; }
  .group button, .chip, .btn {
    font: inherit; font-size: 14px; color: var(--ink-2);
    border: 0; background: transparent; cursor: pointer;
    height: 34px; min-width: 38px; padding: 0 10px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, color .12s;
  }
  .group button:hover, .chip:hover, .btn:hover { background: #e2e2df; }
  .group button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .group button svg { display: block; }
  .chip { background: var(--soft); }
  .chip.on { background: var(--ink); color: #fff; }
  .acc button { font-size: 17px; }
  .spacer { flex: 1; }
  .tempo { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .tempo b { min-width: 28px; display: inline-block; }
  input[type=range] { width: 110px; accent-color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; padding: 0 16px; font-weight: 600; }
  .btn.primary:hover { background: #333; }

  /* Score */
  .score { padding: 8px 4px 4px; position: relative; }
  #score { display: block; width: 100%; cursor: crosshair; user-select: none; }
  .empty {
    position: absolute; left: 0; right: 0; bottom: 22px; text-align: center;
    color: var(--mute); font-size: 13px; pointer-events: none;
  }
  .status {
    display: flex; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums;
  }

  /* Fretboard */
  .bass { margin-top: 16px; padding: 18px 16px 14px; }
  .bass-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .bass-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .bass-head span { font-size: 12px; color: var(--mute); }
  .neck-scroll { overflow-x: auto; }
  #fret { display: block; width: 100%; min-width: 720px; }
  #fret .cell { fill: transparent; cursor: pointer; }
  #fret .cell:hover { fill: rgba(255,255,255,.07); }

  .keys { margin-top: 14px; font-size: 12px; color: var(--mute); line-height: 1.8; }
  kbd {
    font: inherit; font-size: 11px; padding: 1px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">bass<span>.online</span></div>
    <div class="hint">악보에 음표를 그리면 베이스가 연주합니다</div>
  </header>

  <div class="card toolbar">
    <div class="group" id="durs" aria-label="음표 길이"></div>
    <button class="chip" id="restBtn" title="쉼표 입력 (R)">쉼표</button>
    <div class="group acc" id="accs" aria-label="임시표">
      <button data-acc="-1" title="플랫">♭</button>
      <button data-acc="0" title="제자리">♮</button>
      <button data-acc="1" title="샵">♯</button>
    </div>
    <div class="spacer"></div>
    <label class="tempo">♩ = <b id="bpmVal">100</b><input type="range" id="bpm" min="40" max="200" value="100"></label>
    <button class="btn" id="delBtn" title="선택하거나 마지막 음 지우기 (Backspace)">지우기</button>
    <button class="btn" id="clearBtn">전체 삭제</button>
    <button class="btn primary" id="playBtn" title="재생 / 정지 (Space)">▶ 재생</button>
  </div>

  <div class="card">
    <div class="score">
      <svg id="score" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="empty" id="empty">오선 위를 클릭하거나 아래 지판을 눌러 음표를 입력하세요</div>
    </div>
    <div class="status">
      <span id="stat">마디 0 · 음표 0</span>
      <span id="info"></span>
    </div>
  </div>

  <div class="card bass">
    <div class="bass-head">
      <h2>4현 베이스</h2>
      <span>E · A · D · G 표준 튜닝</span>
    </div>
    <div class="neck-scroll"><svg id="fret" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="keys">
      <kbd>1</kbd> 온음표 <kbd>2</kbd> 2분 <kbd>4</kbd> 4분 <kbd>8</kbd> 8분 ·
      <kbd>R</kbd> 쉼표 · <kbd>Space</kbd> 재생/정지 ·
      음표 클릭 후 <kbd>↑</kbd><kbd>↓</kbd> 음높이 · <kbd>Backspace</kbd> 지우기 · <kbd>Esc</kbd> 선택 해제
    </div>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const LETTERS = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
  const SEMI = [0, 2, 4, 5, 7, 9, 11];
  // 반음 → [음이름 인덱스, 임시표] (샵 표기)
  const SPELL = [[0,0],[0,1],[1,0],[1,1],[2,0],[3,0],[3,1],[4,0],[4,1],[5,0],[5,1],[6,0]];
  const DURS = [4, 2, 1, 0.5];
  const DUR_NAME = { 4: '온음표', 2: '2분음표', 1: '4분음표', 0.5: '8분음표' };

  // 베이스 개방현 실음 MIDI: E1 A1 D2 G2 (악보는 한 옥타브 위로 기보)
  const OPEN = [28, 33, 38, 43];
  const STR_NAME = ['E', 'A', 'D', 'G'];
  const FRETS = 12;
  const D_MIN = 16, D_MAX = 32; // 기보 E2 ~ G4

  // 악보 배치 상수
  const SYS_H = 150, TOP = 45, BOT = TOP + 40, LEFT = 14, CLEF_W = 44, TS_W = 30, PAD_R = 14;
  const WIDTH = { 4: 80, 2: 58, 1: 42, 0.5: 34 };
  const ACC_W = 12;

  const state = {
    notes: [],          // {d, acc, beats, rest, pos?}
    dur: 1, rest: false, acc: 0, tempo: 100,
    selected: -1, playhead: -1,
    hover: null,        // {d}
  };

  const svg = document.getElementById('score');
  const fret = document.getElementById('fret');

  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };

  // ---------- 음높이 ----------
  const writtenMidi = n => (Math.floor(n.d / 7) + 1) * 12 + SEMI[n.d % 7] + n.acc;
  const soundMidi = n => writtenMidi(n) - 12;
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);
  const accSym = a => (a > 0 ? '♯' : a < 0 ? '♭' : '');
  const nameOf = n => {
    const m = soundMidi(n);
    return LETTERS[n.d % 7] + accSym(n.acc) + (Math.floor(m / 12) - 1);
  };
  const spell = writtenM => {
    const [li, acc] = SPELL[((writtenM % 12) + 12) % 12];
    return { d: (Math.floor(writtenM / 12) - 1) * 7 + li, acc };
  };
  const positionFor = n => {
    if (n.pos && OPEN[n.pos.s] + n.pos.f === soundMidi(n)) return n.pos;
    const m = soundMidi(n);
    let best = null;
    OPEN.forEach((o, s) => {
      const f = m - o;
      if (f >= 0 && f <= FRETS && (!best || f < best.f)) best = { s, f };
    });
    return best;
  };

  // ---------- 소리 ----------
  let ctx = null, master = null;
  const audio = () => {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      master = ctx.createGain();
      master.gain.value = 0.7;
      master.connect(comp); comp.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  };

  function pluck(midi, t, len, dest) {
    const f = freq(midi);
    const saw = ctx.createOscillator(); saw.type = 'sawtooth'; saw.frequency.value = f;
    const sine = ctx.createOscillator(); sine.type = 'sine'; sine.frequency.value = f;
    const sub = ctx.createOscillator(); sub.type = 'triangle'; sub.frequency.value = f * 2;
    const gSaw = ctx.createGain(); gSaw.gain.value = 0.32;
    const gSine = ctx.createGain(); gSine.gain.value = 0.75;
    const gSub = ctx.createGain(); gSub.gain.value = 0.12;

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 3;
    lp.frequency.setValueAtTime(Math.min(f * 14 + 500, 6000), t);
    lp.frequency.exponentialRampToValueAtTime(f * 2.5 + 140, t + 0.28);

    const env = ctx.createGain();
    env.gain.setValueAtTime(0, t);
    env.gain.linearRampToValueAtTime(0.9, t + 0.006);
    env.gain.setTargetAtTime(0.38, t + 0.006, 0.22);
    const end = t + Math.max(len, 0.08);
    env.gain.setTargetAtTime(0, end, 0.035);

    saw.connect(gSaw).connect(lp);
    sine.connect(gSine).connect(lp);
    sub.connect(gSub).connect(lp);
    lp.connect(env).connect(dest);
    [saw, sine, sub].forEach(o => { o.start(t); o.stop(end + 0.3); });
  }

  function preview(n) {
    if (n.rest) return;
    audio();
    pluck(soundMidi(n), ctx.currentTime + 0.01, 0.5, master);
  }

  // ---------- 재생 ----------
  let playback = null, raf = 0;
  const playBtn = document.getElementById('playBtn');

  function play() {
    if (!state.notes.length) return;
    audio();
    const out = ctx.createGain(); out.connect(master);
    const spb = 60 / state.tempo;
    let t = ctx.currentTime + 0.08;
    const start = state.selected >= 0 ? state.selected : 0;
    const events = [];
    for (let i = start; i < state.notes.length; i++) {
      const n = state.notes[i];
      const len = n.beats * spb;
      if (!n.rest) pluck(soundMidi(n), t, len * 0.92, out);
      events.push({ i, t });
      t += len;
    }
    playback = { out, events, end: t };
    playBtn.textContent = '■ 정지';
    tick();
  }

  function stop() {
    if (!playback) return;
    const out = playback.out;
    out.gain.setTargetAtTime(0, ctx.currentTime, 0.02);
    setTimeout(() => out.disconnect(), 300);
    playback = null;
    cancelAnimationFrame(raf);
    state.playhead = -1;
    playBtn.textContent = '▶ 재생';
    render();
  }

  function tick() {
    if (!playback) return;
    const now = ctx.currentTime;
    if (now >= playback.end) { stop(); return; }
    let cur = -1;
    for (const ev of playback.events) if (now >= ev.t) cur = ev.i;
    if (cur !== state.playhead) { state.playhead = cur; render(); }
    raf = requestAnimationFrame(tick);
  }

  // ---------- 배치 ----------
  function layout(width) {
    const items = [], bars = [];
    let sys = 0, cursor = LEFT + CLEF_W + TS_W, beats = 0, accMap = {};
    const limit = width - PAD_R;

    state.notes.forEach((n, i) => {
      let shown = null;
      if (!n.rest) {
        const prev = accMap[n.d] ?? 0;
        if (n.acc !== prev) shown = n.acc;
        accMap[n.d] = n.acc;
      }
      const w = WIDTH[n.beats] + (shown !== null ? ACC_W : 0);
      if (cursor + w > limit) { sys++; cursor = LEFT + CLEF_W; }
      items.push({ i, x: cursor + 18 + (shown !== null ? ACC_W : 0), sys, shown });
      cursor += w;
      beats += n.beats;
      if (beats >= 4 - 1e-9) {
        bars.push({ x: cursor, sys });
        cursor += 6; beats = 0; accMap = {};
      }
    });

    let gSys = sys, gCursor = cursor;
    if (gCursor + WIDTH[state.dur] + ACC_W > limit) { gSys++; gCursor = LEFT + CLEF_W; }
    return { items, bars, systems: gSys + 1, ghost: { x: gCursor + 18, sys: gSys, accMap: gSys === sys ? accMap : {} } };
  }

  const yOf = (d, sys) => sys * SYS_H + BOT - (d - 18) * 5;
  const dFromY = (y, sys) => Math.max(D_MIN, Math.min(D_MAX, Math.round((sys * SYS_H + BOT - y) / 5) + 18));

  // ---------- 악보 그리기 ----------
  function drawClef(g, x, sys) {
    const fy = sys * SYS_H + TOP + 10; // F3 줄 (위에서 두 번째 줄)
    el('circle', { cx: x + 4, cy: fy, r: 4.2, fill: 'var(--ink)' }, g);
    el('path', {
      d: `M${x + 1} ${fy} C${x + 1} ${fy - 13} ${x + 21} ${fy - 15} ${x + 24} ${fy - 1} C${x + 27} ${fy + 14} ${x + 12} ${fy + 27} ${x - 2} ${fy + 33}`,
      fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2.6, 'stroke-linecap': 'round',
    }, g);
    el('circle', { cx: x + 31, cy: fy - 5, r: 2, fill: 'var(--ink)' }, g);
    el('circle', { cx: x + 31, cy: fy + 5, r: 2, fill: 'var(--ink)' }, g);
  }

  function drawTime(g, x, sys) {
    const top = sys * SYS_H + TOP;
    for (const dy of [10, 30]) {
      const t = el('text', {
        x, y: top + dy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 23, 'font-weight': 800, 'font-family': 'Georgia, "Times New Roman", serif', fill: 'var(--ink)',
      }, g);
      t.textContent = '4';
    }
  }

  function drawLedgers(g, x, d, sys, color) {
    for (let l = 16; l >= d; l -= 2) el('line', { x1: x - 10, x2: x + 10, y1: yOf(l, sys), y2: yOf(l, sys), stroke: color, 'stroke-width': 1.2 }, g);
    for (let l = 28; l <= d; l += 2) el('line', { x1: x - 10, x2: x + 10, y1: yOf(l, sys), y2: yOf(l, sys), stroke: color, 'stroke-width': 1.2 }, g);
  }

  function drawNote(g, n, x, sys, shown, color) {
    if (n.rest) return drawRest(g, n.beats, x, sys, color);
    const y = yOf(n.d, sys);
    drawLedgers(g, x, n.d, sys, color);
    const filled = n.beats <= 1;
    el('ellipse', {
      cx: x, cy: y, rx: 6.4, ry: 4.5, transform: `rotate(-20 ${x} ${y})`,
      fill: filled ? color : 'none', stroke: color, 'stroke-width': filled ? 1 : 1.8,
    }, g);
    if (n.beats < 4) {
      const up = n.d < 22;
      const sx = up ? x + 5.8 : x - 5.8;
      const ey = up ? y - 34 : y + 34;
      el('line', { x1: sx, x2: sx, y1: y + (up ? -1 : 1), y2: ey, stroke: color, 'stroke-width': 1.4 }, g);
      if (n.beats === 0.5) {
        const k = up ? 1 : -1;
        el('path', {
          d: `M${sx} ${ey} C${sx + 1} ${ey + 8 * k} ${sx + 11} ${ey + 10 * k} ${sx + 9} ${ey + 22 * k} C${sx + 8} ${ey + 15 * k} ${sx + 4} ${ey + 12 * k} ${sx} ${ey + 11 * k} Z`,
          fill: color,
        }, g);
      }
    }
    if (shown !== null) {
      const t = el('text', {
        x: x - 15, y, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-size': 17, fill: color,
      }, g);
      t.textContent = shown > 0 ? '♯' : shown < 0 ? '♭' : '♮';
    }
  }

  function drawRest(g, beats, x, sys, color) {
    const mid = sys * SYS_H + TOP + 20;
    if (beats === 4) el('rect', { x: x - 6, y: mid - 10, width: 12, height: 5, fill: color }, g);
    else if (beats === 2) el('rect', { x: x - 6, y: mid - 5, width: 12, height: 5, fill: color }, g);
    else if (beats === 1) {
      el('path', {
        d: `M${x - 3} ${mid - 15} L${x + 4} ${mid - 7} L${x - 2} ${mid - 1} L${x + 4} ${mid + 6} C${x - 3} ${mid + 3} ${x - 4} ${mid + 10} ${x + 1} ${mid + 14}`,
        fill: 'none', stroke: color, 'stroke-width': 2.6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
      }, g);
    } else {
      el('circle', { cx: x - 3, cy: mid - 5, r: 2.6, fill: color }, g);
      el('path', { d: `M${x - 4} ${mid - 3} Q${x} ${mid - 1} ${x + 4} ${mid - 7} L${x - 1} ${mid + 9}`, fill: 'none', stroke: color, 'stroke-width': 1.5 }, g);
    }
  }

  let lastLayout = null;

  function renderScore() {
    const width = svg.clientWidth || 800;
    const L = layout(width);
    lastLayout = L;
    const h = L.systems * SYS_H + 10;
    svg.setAttribute('viewBox', `0 0 ${width} ${h}`);
    svg.setAttribute('height', h);
    svg.textContent = '';

    // 강조 배경
    const bg = el('g', {}, svg);
    const mark = (idx, fill, stroke) => {
      const it = L.items[idx]; if (!it) return;
      const top = it.sys * SYS_H;
      el('rect', { x: it.x - 15, y: top + 6, width: 30, height: SYS_H - 14, rx: 7, fill, stroke: stroke || 'none' }, bg);
    };
    if (state.playhead >= 0) mark(state.playhead, '#e6e6e4');
    if (state.selected >= 0 && state.selected !== state.playhead) mark(state.selected, 'none', '#b5b5b2');

    for (let s = 0; s < L.systems; s++) {
      const g = el('g', {}, svg);
      for (let k = 0; k < 5; k++) {
        const y = s * SYS_H + TOP + k * 10;
        el('line', { x1: LEFT, x2: width - PAD_R, y1: y, y2: y, stroke: '#9a9a98', 'stroke-width': 1 }, g);
      }
      el('line', { x1: LEFT, x2: LEFT, y1: s * SYS_H + TOP, y2: s * SYS_H + BOT, stroke: 'var(--ink)', 'stroke-width': 1.2 }, g);
      drawClef(g, LEFT + 8, s);
      if (s === 0) drawTime(g, LEFT + CLEF_W + 10, s);
    }

    for (const b of L.bars) {
      el('line', { x1: b.x, x2: b.x, y1: b.sys * SYS_H + TOP, y2: b.sys * SYS_H + BOT, stroke: 'var(--ink)', 'stroke-width': 1.2 }, svg);
    }

    const ng = el('g', {}, svg);
    for (const it of L.items) drawNote(ng, state.notes[it.i], it.x, it.sys, it.shown, 'var(--ink)');

    // 입력 미리보기 (고스트)
    if (state.hover && !playback) {
      const gh = L.ghost;
      const n = state.rest ? { rest: true, beats: state.dur } : { d: state.hover.d, acc: state.acc, beats: state.dur };
      let shown = null;
      if (!n.rest) { const prev = gh.accMap[n.d] ?? 0; if (n.acc !== prev) shown = n.acc; }
      drawNote(el('g', { opacity: 0.32 }, svg), n, gh.x + (shown !== null ? ACC_W : 0), gh.sys, shown, 'var(--ink)');
    }

    document.getElementById('empty').style.display = state.notes.length ? 'none' : '';
  }

  // ---------- 지판 ----------
  const NUT = 64, NECK_END = 985;
  const fretX = n => NUT + ((1 - Math.pow(2, -n / 12)) / 0.5) * (NECK_END - NUT);
  const strY = s => 150 - s * 36; // E 아래, G 위
  const cellX = f => (f === 0 ? NUT / 2 + 4 : (fretX(f - 1) + fretX(f)) / 2);
  let fretLayer;

  function buildFret() {
    el('rect', { x: NUT, y: 18, width: NECK_END - NUT, height: 150, rx: 4, fill: 'var(--neck)' }, fret);
    [3, 5, 7, 9].forEach(f => el('circle', { cx: cellX(f), cy: 96, r: 6, fill: 'var(--dot)' }, fret));
    el('circle', { cx: cellX(12), cy: 60, r: 6, fill: 'var(--dot)' }, fret);
    el('circle', { cx: cellX(12), cy: 132, r: 6, fill: 'var(--dot)' }, fret);
    for (let f = 1; f <= FRETS; f++) {
      el('line', { x1: fretX(f), x2: fretX(f), y1: 18, y2: 168, stroke: 'var(--fret)', 'stroke-width': 2 }, fret);
      const t = el('text', { x: cellX(f), y: 184, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--mute)' }, fret);
      t.textContent = f;
    }
    el('rect', { x: NUT - 5, y: 16, width: 6, height: 154, rx: 1.5, fill: '#e8e8e6' }, fret);
    OPEN.forEach((_, s) => {
      const y = strY(s);
      el('line', { x1: 34, x2: NECK_END, y1: y, y2: y, stroke: 'var(--string)', 'stroke-width': 3.4 - s * 0.6 }, fret);
      const t = el('text', { x: 14, y, 'dominant-baseline': 'central', 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 600, fill: 'var(--ink-2)' }, fret);
      t.textContent = STR_NAME[s];
    });
    fretLayer = el('g', { 'pointer-events': 'none' }, fret);
    const hit = el('g', {}, fret);
    OPEN.forEach((_, s) => {
      for (let f = 0; f <= FRETS; f++) {
        const x0 = f === 0 ? 26 : fretX(f - 1), x1 = f === 0 ? NUT - 5 : fretX(f);
        const c = el('rect', { class: 'cell', x: x0, y: strY(s) - 18, width: x1 - x0, height: 36 }, hit);
        c.addEventListener('pointerdown', e => { e.preventDefault(); onFret(s, f); });
      }
    });
  }

  let flash = null, flashTimer = 0;

  function renderFret() {
    fretLayer.textContent = '';
    const marks = [];
    const idx = state.playhead >= 0 ? state.playhead : state.selected;
    const n = state.notes[idx];
    if (n && !n.rest) { const p = positionFor(n); if (p) marks.push({ ...p, n }); }
    if (flash && !marks.some(m => m.s === flash.s && m.f === flash.f)) marks.push(flash);
    for (const m of marks) {
      const x = cellX(m.f), y = strY(m.s);
      el('circle', { cx: x, cy: y, r: 12, fill: '#fafafa', stroke: '#000', 'stroke-width': 1.5 }, fretLayer);
      const t = el('text', { x, y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': 10.5, 'font-weight': 700, fill: '#111' }, fretLayer);
      t.textContent = LETTERS[m.n.d % 7] + accSym(m.n.acc);
    }
  }

  // ---------- 상태 표시 ----------
  function renderStatus() {
    const total = state.notes.reduce((a, n) => a + n.beats, 0);
    const measures = Math.ceil(total / 4 - 1e-9);
    document.getElementById('stat').textContent = `마디 ${measures} · 음표 ${state.notes.length}`;
    let info = '';
    const sel = state.notes[state.selected];
    if (sel) info = `선택: ${sel.rest ? '쉼표' : nameOf(sel)} · ${DUR_NAME[sel.beats]}`;
    else if (state.hover && !state.rest) info = `입력: ${nameOf({ d: state.hover.d, acc: state.acc })} · ${DUR_NAME[state.dur]}`;
    else info = `입력: ${state.rest ? '쉼표' : '음표'} · ${DUR_NAME[state.dur]}`;
    document.getElementById('info').textContent = info;

    document.querySelectorAll('#durs button').forEach(b => b.classList.toggle('on', +b.dataset.b === state.dur));
    document.querySelectorAll('#accs button').forEach(b => b.classList.toggle('on', +b.dataset.acc === state.acc));
    document.getElementById('restBtn').classList.toggle('on', state.rest);
  }

  function render() { renderScore(); renderFret(); renderStatus(); }

  // ---------- 입력 ----------
  function append(n) {
    state.notes.push(n);
    state.selected = -1;
    preview(n);
    render();
  }

  function onFret(s, f) {
    if (playback) stop();
    const sp = spell(OPEN[s] + f + 12);
    const sel = state.notes[state.selected];
    if (sel && !sel.rest) {
      Object.assign(sel, sp, { pos: { s, f } });
      preview(sel);
      render();
    } else {
      append({ ...sp, beats: state.dur, rest: false, pos: { s, f } });
    }
    clearTimeout(flashTimer);
    flash = { s, f, n: sp };
    renderFret();
    flashTimer = setTimeout(() => { flash = null; renderFret(); }, 450);
  }

  function pointerInfo(e) {
    const r = svg.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const sys = Math.max(0, Math.min((lastLayout?.systems ?? 1) - 1, Math.floor(y / SYS_H)));
    return { x, y, sys };
  }

  svg.addEventListener('pointermove', e => {
    const { y, sys } = pointerInfo(e);
    const d = dFromY(y, sys);
    if (!state.hover || state.hover.d !== d) { state.hover = { d }; renderScore(); renderStatus(); }
  });
  svg.addEventListener('pointerleave', () => { state.hover = null; renderScore(); renderStatus(); });

  svg.addEventListener('pointerdown', e => {
    if (playback) stop();
    const { x, y, sys } = pointerInfo(e);
    const hit = lastLayout.items.find(it => {
      if (it.sys !== sys || Math.abs(it.x - x) > 11) return false;
      const n = state.notes[it.i];
      return n.rest || Math.abs(yOf(n.d, sys) - y) < 14;
    });
    if (hit) {
      state.selected = state.selected === hit.i ? -1 : hit.i;
      if (state.selected >= 0) preview(state.notes[hit.i]);
      render();
      return;
    }
    if (state.selected >= 0) { state.selected = -1; render(); return; }
    if (state.rest) append({ rest: true, beats: state.dur, d: 22, acc: 0 });
    else append({ d: dFromY(y, sys), acc: state.acc, beats: state.dur, rest: false });
  });

  function del() {
    if (playback) stop();
    if (state.selected >= 0) {
      state.notes.splice(state.selected, 1);
      state.selected = Math.min(state.selected, state.notes.length - 1);
      if (!state.notes.length) state.selected = -1;
    } else state.notes.pop();
    render();
  }

  function setDur(b) {
    state.dur = b;
    const sel = state.notes[state.selected];
    if (sel) sel.beats = b;
    render();
  }

  function setAcc(a) {
    state.acc = a;
    const sel = state.notes[state.selected];
    if (sel && !sel.rest) { sel.acc = a; delete sel.pos; preview(sel); }
    render();
  }

  // 툴바 생성
  const durWrap = document.getElementById('durs');
  DURS.forEach(b => {
    const btn = document.createElement('button');
    btn.dataset.b = b;
    btn.title = DUR_NAME[b];
    const s = el('svg', { width: 18, height: 24, viewBox: '0 0 18 24' }, btn);
    const filled = b <= 1;
    el('ellipse', { cx: 7, cy: 18.5, rx: 4.8, ry: 3.4, transform: 'rotate(-20 7 18.5)', fill: filled ? 'currentColor' : 'none', stroke: 'currentColor', 'stroke-width': filled ? 1 : 1.6 }, s);
    if (b < 4) el('line', { x1: 11.3, x2: 11.3, y1: 18, y2: 2, stroke: 'currentColor', 'stroke-width': 1.4 }, s);
    if (b === 0.5) el('path', { d: 'M11.3 2 C12 6 17 7 16 13 C15 9 13 8 11.3 8 Z', fill: 'currentColor' }, s);
    btn.addEventListener('click', () => setDur(b));
    durWrap.appendChild(btn);
  });
  document.querySelectorAll('#accs button').forEach(b => b.addEventListener('click', () => setAcc(+b.dataset.acc)));
  document.getElementById('restBtn').addEventListener('click', () => { state.rest = !state.rest; render(); });
  document.getElementById('delBtn').addEventListener('click', del);
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!state.notes.length || !confirm('악보를 모두 지울까요?')) return;
    if (playback) stop();
    state.notes = []; state.selected = -1; render();
  });
  playBtn.addEventListener('click', () => (playback ? stop() : play()));
  const bpm = document.getElementById('bpm');
  bpm.addEventListener('input', () => { state.tempo = +bpm.value; document.getElementById('bpmVal').textContent = bpm.value; });

  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const inRange = e.target === bpm;
    const k = e.key;
    if (k === ' ') { e.preventDefault(); playback ? stop() : play(); return; }
    if (inRange) return;
    if (k === '1') setDur(4);
    else if (k === '2') setDur(2);
    else if (k === '4') setDur(1);
    else if (k === '8') setDur(0.5);
    else if (k === 'r' || k === 'R') { state.rest = !state.rest; render(); }
    else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); del(); }
    else if (k === 'Escape') { state.selected = -1; render(); }
    else if ((k === 'ArrowUp' || k === 'ArrowDown') && state.notes[state.selected] && !state.notes[state.selected].rest) {
      e.preventDefault();
      const n = state.notes[state.selected];
      n.d = Math.max(D_MIN, Math.min(D_MAX, n.d + (k === 'ArrowUp' ? 1 : -1)));
      n.acc = 0; delete n.pos;
      preview(n); render();
    } else if ((k === 'ArrowLeft' || k === 'ArrowRight') && state.notes.length) {
      e.preventDefault();
      const max = state.notes.length - 1;
      const cur = state.selected < 0 ? (k === 'ArrowLeft' ? max + 1 : -1) : state.selected;
      state.selected = Math.max(0, Math.min(max, cur + (k === 'ArrowLeft' ? -1 : 1)));
      preview(state.notes[state.selected]); render();
    }
  });

  window.addEventListener('resize', renderScore);
  buildFret();
  render();
})();
</script>
</body>
</html>
